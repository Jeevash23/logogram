[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "logogram"
dynamic = ["version"]
description = "A local-first workbench for causal experiments inside language models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Logogram contributors" }]
requires-python = ">=3.11"
keywords = ["interpretability", "mechanistic-interpretability", "activation-patching", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "typer>=0.12",
    "numpy>=1.26",
    "pyarrow>=15",
    "platformdirs>=4",
    "psutil>=5.9",
    "torch>=2.4",
    "transformer-lens>=4.0,<5",
    "transformers>=4.45",
    "huggingface-hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/Jeevash23/logogram"
Source = "https://github.com/Jeevash23/logogram"
Issues = "https://github.com/Jeevash23/logogram/issues"
Changelog = "https://github.com/Jeevash23/logogram/blob/main/CHANGELOG.md"

[project.scripts]
logogram = "logogram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff==0.16.10",
]

[tool.hatch.version]
path = "src/logogram/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/logogram"]
# The production web build is generated by `npm run build` in /web.
artifacts = ["src/logogram/web_dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src/logogram", "web/src", "web/public", "web/tests", "web/package.json", "web/package-lock.json", "web/index.html", "web/tsconfig.json", "web/vite.config.ts", "web/playwright.config.ts", "uv.lock", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "AGENTS.md"]
artifacts = ["src/logogram/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
