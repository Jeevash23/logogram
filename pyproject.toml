[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "logogram"
dynamic = ["version"]
description = "A local-first workbench for causal experiments inside language models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "The Logogram contributors" }]
requires-python = ">=3.11"
keywords = ["interpretability", "mechanistic-interpretability", "activation-patching", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    # Typer 0.12 with Click 8.3 or later ignores --version and starts the server.
    "typer>=0.13",
    "numpy>=1.26",
    "pyarrow>=15",
    "platformdirs>=4",
    "psutil>=5.9",
    "torch>=2.4",
    "transformer-lens>=4.0,<5",
    "transformers>=4.45",
    "huggingface-hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/Jeevash23/logogram"
Source = "https://github.com/Jeevash23/logogram"
Issues = "https://github.com/Jeevash23/logogram/issues"
Changelog = "https://github.com/Jeevash23/logogram/blob/main/CHANGELOG.md"

[project.scripts]
logogram = "logogram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "httpx2>=2.13",
    "ruff==0.16.10",
]

[tool.hatch.version]
path = "src/logogram/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/logogram"]
# The production web build is generated by `npm run build` in /web.
artifacts = ["src/logogram/web_dist/**"]

[tool.hatch.build.targets.sdist]
include = ["src/logogram", "web/src", "web/public", "web/tests", "web/package.json", "web/package-lock.json", "web/index.html", "web/tsconfig.json", "web/vite.config.ts", "web/playwright.config.ts", "uv.lock", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "AGENTS.md"]
artifacts = ["src/logogram/web_dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
# CI runs `npx pyright@1.1.408 --pythonpath .venv/bin/python` (the version is pinned there).
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
# Coverage data then holds project-relative paths, not this machine's.
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "BLE", "RUF"]
ignore = [
    "E501",
    "B008",
    "S101",  # assert states invariants, and tests are made of them
    "S311",  # seeded random.Random makes datasets reproducible; nothing here is a secret
    "S607",  # hardware probes run tools such as nvidia-smi by name, never through a shell
    "RUF001",  # typography: −, ×, → and … are meant
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Fixed session tokens, temporary folders and subprocesses of this Python in tests.
"tests/**" = ["S105", "S106", "S108", "S603"]
"scripts/smoke_wheel.py" = ["S106"]
