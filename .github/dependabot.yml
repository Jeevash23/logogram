version: 2

# Monthly version updates, minor and patch releases grouped into one pull request per ecosystem.
# Majors come one by one. A cooldown lets a new release settle before it is proposed. Security
# updates skip both: with Dependabot security updates on in the repository's settings, a fix for
# a known vulnerability is proposed as soon as there is one.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # Changes here change the committed build in src/logogram/web_dist: run `npm run build` in
  # web/ on the pull request's branch, or CI's committed-build check fails.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web:
        update-types: [minor, patch]

  # pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
