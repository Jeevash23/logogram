name: Release

# Pushing a tag such as v0.1.0 runs the full CI on that commit, builds the distributions and
# uploads them to PyPI. PyPI trusts this workflow directly (Trusted Publishing), so no token or
# password is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Never cancel a release halfway through publishing.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # A job that calls a workflow takes no timeout-minutes; each job in ci.yml has its own.
    uses: ./.github/workflows/ci.yml

  build:
    name: Build the distributions
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag matches the package version
        run: |
          version=$(PYTHONPATH=src python3 -c "import logogram; print(logogram.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but src/logogram/__init__.py says $version."
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/logogram/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
